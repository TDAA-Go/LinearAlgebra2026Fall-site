name: Deploy Course Site to GitHub Pages

on:
  repository_dispatch:
    types: [course-materials-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  COURSE_SOURCE_DIR: vendor/course-source
  SOLUTION_KEY_POLICY: schedule

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Checkout private course source
        uses: actions/checkout@v4
        with:
          repository: TDAA-Go/LinearAlgebra2026
          path: ${{ env.COURSE_SOURCE_DIR }}
          ssh-key: ${{ secrets.COURSE_SOURCE_DEPLOY_KEY }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /config.toml
            /config.typ
            /templates/
            /week*/**.learning-sheet.typ
            /week*/**.validation.typ
            /coursedesign/session-schedule.json

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Refuse unsafe policy
        run: test "$SOLUTION_KEY_POLICY" != all

      - name: Build public site
        run: make build COURSE_SOURCE_DIR="$COURSE_SOURCE_DIR" SOLUTION_KEY_POLICY="$SOLUTION_KEY_POLICY"

      - name: Check public artifact
        run: |
          scripts/check_public_site_artifacts.py _site \
            --schedule "$COURSE_SOURCE_DIR/coursedesign/session-schedule.json" \
            --policy "$SOLUTION_KEY_POLICY"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
